spring.application.name=form-builder-api

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/FormStudioDb
spring.datasource.username=postgres
spring.datasource.password=Tatva@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# JWT Security Configuration
formstudio.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
formstudio.jwt.expiration-ms=${JWT_EXPIRATION:300000}
formstudio.jwt.refresh-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

# CORS Configuration
formstudio.cors.allowed-origins=${CORS_ORIGIN:http://localhost:4200}

# File Storage Configuration
formstudio.upload.dir=${UPLOAD_DIR:D:/Anguler/formstudio-storage/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB


